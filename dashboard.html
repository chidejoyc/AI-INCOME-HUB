<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Dashboard | AI Income Hub</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#0f172a;
color:white;
}

header{
background:#2563eb;
padding:20px;
text-align:center;
}

.container{
padding:30px;
max-width:1100px;
margin:auto;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
margin-top:30px;
}

.card{
background:#1e293b;
padding:25px;
border-radius:12px;
}

.card h2{
margin-top:0;
}

.btn{
display:inline-block;
margin-top:15px;
padding:12px 18px;
background:#06b6d4;
color:white;
text-decoration:none;
border-radius:8px;
}

.progress{
background:#334155;
height:10px;
border-radius:10px;
overflow:hidden;
margin-top:15px;
}

.progress div{
background:#22c55e;
height:10px;
width:40%;
}
</style>

</head>

<body>

<header>

<h1>Welcome to AI Income Hub</h1>

<p>Your Student Dashboard</p>

</header>

<div class="container">

<div class="grid">

<div class="card">
<h2>📚 My Courses</h2>
<p>You haven't purchased any courses yet.</p>
<a class="btn" href="premium-courses.html">Browse Courses</a>
</div>

<div class="card">
<h2>🎯 Learning Progress</h2>
<p>Overall Progress</p>
<div class="progress">
<div></div>
</div>
</div>

<div class="card">
<h2>📄 Downloads</h2>
<p>Your PDFs and resources will appear here.</p>
</div>

<div class="card">
<h2>👤 Profile</h2>
<p>Manage your account information.</p>
</div>

</div>

</div>

</body>
</html>
