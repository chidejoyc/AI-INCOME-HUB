<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up | AI Income Hub</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#0f172a;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
}
.container{
    width:350px;
    background:#1e293b;
    padding:30px;
    border-radius:12px;
    color:white;
}
input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:none;
    border-radius:8px;
}
button{
    width:100%;
    padding:12px;
    background:#2563eb;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
}
a{
    color:#38bdf8;
}
</style>
</head>

<body>

<div class="container">
<h2>Create Account</h2>

<input id="name" type="text" placeholder="Full Name">
<input id="email" type="email" placeholder="Email Address">
<input id="password" type="password" placeholder="Password">

<button>Create Account</button>

<p>Already have an account?
<a href="login.html">Login</a>
</p>

</div>

</body>
</html>
