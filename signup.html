<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up | AI Income Hub</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#0f172a;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    width:360px;
    background:#1e293b;
    padding:30px;
    border-radius:12px;
    box-shadow:0 0 20px rgba(0,0,0,.4);
}

h1{
    color:white;
    text-align:center;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:none;
    border-radius:8px;
    font-size:16px;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:8px;
    background:#2563eb;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}

p{
    color:white;
    text-align:center;
    margin-top:15px;
}

a{
    color:#38bdf8;
    text-decoration:none;
}
</style>
</head>

<body>

<div class="container">

<h1>Create Account</h1>

<input id="name" type="text" placeholder="Full Name">

<input id="email" type="email" placeholder="Email Address">

<input id="password" type="password" placeholder="Password">

<button id="signupBtn">Create Account</button>

<p>Already have an account?
<a href="login.html">Login</a>
</p>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyD5Oa3L8LIzPdA4gsJBjnFC8V8Sucbcjh4",
  authDomain: "ai-income-hub-9d5e1.firebaseapp.com",
  projectId: "ai-income-hub-9d5e1",
  storageBucket: "ai-income-hub-9d5e1.firebasestorage.app",
  messagingSenderId: "155464914796",
  appId: "1:155464914796:web:3f642de8ccac4a301e0549"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

document.getElementById("signupBtn").addEventListener("click", async () => {

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    if(email === "" || password === ""){
        alert("Please enter your email and password.");
        return;
    }

    try{
        await createUserWithEmailAndPassword(auth, email, password);
        alert("Account created successfully!");
        window.location.href = "login.html";
    }catch(error){
        alert(error.message);
    }

});
</script>

</body>
</html>
