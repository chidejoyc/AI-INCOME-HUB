<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up | AI Income Hub</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0f172a;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.container{
background:#1e293b;
padding:40px;
border-radius:15px;
width:350px;
box-shadow:0 0 20px rgba(0,0,0,.3);
}

h1{
text-align:center;
color:white;
margin-bottom:25px;
}

input{
width:100%;
padding:12px;
margin:10px 0;
border:none;
border-radius:8px;
font-size:16px;
}

button{
width:100%;
padding:14px;
background:#2563eb;
border:none;
border-radius:8px;
color:white;
font-size:16px;
cursor:pointer;
margin-top:15px;
}

button:hover{
background:#1d4ed8;
}

p{
text-align:center;
margin-top:20px;
color:white;
}

a{
color:#38bdf8;
text-decoration:none;
}
</style>

</head>

<body>

<div class="container">

<h1>Create Account</h1>

<form>

<input type="text" placeholder="Full Name" required>

<input type="email" placeholder="Email Address" required>

<input type="password" placeholder="Password" required>

<input type="password" placeholder="Confirm Password" required>

<button type="submit">Create Account</button>

</form>

<p>
Already have an account?
<a href="login.html">Login</a>
</p>

</div>

</body>
</html>
